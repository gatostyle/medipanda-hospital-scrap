name: Scrape Hospitals

on:
  schedule:
    # 매주 일요일 새벽 3시 (KST) = 토요일 UTC 18:00
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install selenium pandas openpyxl requests

      - name: Run scraper
        run: python scrape_hospitals.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-data
          path: hospital_data.json
          retention-days: 1

  deploy-dev:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-data

      - name: Send to DEV API
        env:
          API_URL: https://dev.api.medipanda.co.kr
        run: python send_to_api.py

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: hospital-data

      - name: Send to PROD API
        env:
          API_URL: https://prod.api.medipanda.co.kr
        run: python send_to_api.py